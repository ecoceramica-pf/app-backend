openapi: 3.0.0
info:
  title: Ecocerâmica API
  description: API RESTful do sistema Ecocerâmica para gerenciamento de descartes e coletas de resíduos cerâmicos em Porto Ferreira.
  version: 3.0.0
servers:
  - url: http://localhost:8000/api
    description: Ambiente de Desenvolvimento
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []

paths:
  # ========== AUTENTICAÇÃO ==========
  /register:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, password, tipo_perfil, documento, telefone]
              properties:
                nome:
                  type: string
                  example: "Fábrica Teste"
                email:
                  type: string
                  example: "fabrica@teste.com"
                password:
                  type: string
                  example: "123456"
                tipo_perfil:
                  type: string
                  enum: [fabrica, coletor]
                  example: "fabrica"
                documento:
                  type: string
                  example: "12345678000199"
                telefone:
                  type: string
                  example: "11999999999"
      responses:
        '201':
          description: Usuário registrado com sucesso
        '422':
          description: Erro de validação

  /login:
    post:
      tags:
        - Autenticação
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "fabrica@teste.com"
                password:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Login realizado com sucesso
        '401':
          description: Credenciais inválidas

  /me:
    get:
      tags:
        - Autenticação
      summary: Dados do usuário logado
      responses:
        '200':
          description: Dados do usuário autenticado
        '401':
          description: Não autenticado
    put:
      tags:
        - Autenticação
      summary: Atualizar perfil do usuário logado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: "Fábrica Atualizada"
                telefone:
                  type: string
                  example: "11988888888"
                password:
                  type: string
                  example: "novaSenha123"
      responses:
        '200':
          description: Perfil atualizado com sucesso
        '422':
          description: Erro de validação

  /logout:
    post:
      tags:
        - Autenticação
      summary: Logout
      responses:
        '200':
          description: Logout realizado com sucesso

  # ========== ENDEREÇOS ==========
  /enderecos:
    get:
      tags:
        - Endereços
      summary: Listar endereços do usuário
      responses:
        '200':
          description: Lista de endereços do usuário autenticado
    post:
      tags:
        - Endereços
      summary: Cadastrar endereço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logradouro, numero, bairro, cidade]
              properties:
                logradouro:
                  type: string
                  example: "Rua da Fábrica Principal"
                numero:
                  type: string
                  example: "123"
                bairro:
                  type: string
                  example: "Centro"
                cidade:
                  type: string
                  example: "Porto Ferreira"
                estado:
                  type: string
                  example: "SP"
                cep:
                  type: string
                  example: "13660-000"
                complemento:
                  type: string
                  example: "Galpão 2"
                localizacao:
                  type: string
                  example: "POINT(-47.4667 -21.85)"
      responses:
        '201':
          description: Endereço cadastrado com sucesso
        '422':
          description: Erro de validação

  /enderecos/{id}:
    get:
      tags:
        - Endereços
      summary: Detalhar endereço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes do endereço
        '403':
          description: Acesso não autorizado
        '404':
          description: Endereço não encontrado
    put:
      tags:
        - Endereços
      summary: Atualizar endereço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logradouro:
                  type: string
                  example: "Rua Nova Atualizada"
                numero:
                  type: string
                  example: "456"
                estado:
                  type: string
                  example: "SP"
                cep:
                  type: string
                  example: "13660-000"
                complemento:
                  type: string
                  example: "Galpão 3"
                localizacao:
                  type: string
                  example: "POINT(-47.4667 -21.85)"
      responses:
        '200':
          description: Endereço atualizado com sucesso
        '403':
          description: Acesso não autorizado
    delete:
      tags:
        - Endereços
      summary: Excluir endereço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Endereço excluído com sucesso
        '403':
          description: Acesso não autorizado

  # ========== OFERTAS DE RESÍDUOS ==========
  /ofertas:
    get:
      tags:
        - Ofertas de Resíduos
      summary: Listar mural de ofertas
      parameters:
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
          description: Filtrar por tipo de material
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Disponivel, EmProcesso, Concluido]
          description: Filtrar por status (padrão Disponivel)
      responses:
        '200':
          description: Lista paginada de ofertas
    post:
      tags:
        - Ofertas de Resíduos
      summary: Criar oferta (Fábrica)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endereco_id, material_id]
              properties:
                endereco_id:
                  type: integer
                  example: 1
                material_id:
                  type: integer
                  example: 1
                quantidade_kg:
                  type: number
                  example: 150.5
                quantidade_cacamba:
                  type: integer
                  nullable: true
                observacoes:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Oferta criada com sucesso

  /ofertas/{id}:
    get:
      tags:
        - Ofertas de Resíduos
      summary: Detalhar oferta
      description: |
        Retorna os detalhes da oferta, incluindo imagens, material e a configuração
        de disponibilidade da fábrica (quando existir) para que o frontend saiba se
        deve exibir o seletor de agendamento.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da oferta com imagens, material e disponibilidade da fábrica
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      uuid:
                        type: string
                      material:
                        type: object
                      endereco:
                        type: object
                      fabrica_disponibilidade:
                        type: object
                        nullable: true
                        description: Configuração de disponibilidade da fábrica (null se não configurada)
                        properties:
                          dias_semana:
                            type: array
                            items:
                              type: integer
                            example: [1, 2, 3, 4, 5]
                          duracao_coleta_min:
                            type: integer
                            nullable: true
                            description: "Duração em minutos (30, 60, 120). null = dia inteiro"
                            example: 60
                          antecedencia_minima_dias:
                            type: integer
                            example: 1
                          max_coletas_dia:
                            type: integer
                            example: 3
                          faixas_horarios:
                            type: array
                            items:
                              type: object
                              properties:
                                hora_inicio:
                                  type: string
                                  example: "08:00"
                                hora_fim:
                                  type: string
                                  example: "12:00"
    put:
      tags:
        - Ofertas de Resíduos
      summary: Atualizar oferta (apenas se Disponível)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endereco_id:
                  type: integer
                material_id:
                  type: integer
                quantidade_kg:
                  type: number
                  example: 200
                quantidade_cacamba:
                  type: integer
                observacoes:
                  type: string
                  example: "Material atualizado"
      responses:
        '200':
          description: Oferta atualizada com sucesso
        '403':
          description: Acesso não autorizado ou oferta em processo/concluída
    delete:
      tags:
        - Ofertas de Resíduos
      summary: Excluir oferta (apenas se Disponível)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Oferta excluída com sucesso
        '403':
          description: Acesso não autorizado ou oferta em processo/concluída

  /ofertas/{uuid}/imagens:
    post:
      tags:
        - Ofertas de Resíduos
      summary: Upload de imagens da oferta
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: UUID da oferta
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imagens[]:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Imagens salvas com sucesso
        '403':
          description: Acesso não autorizado
        '422':
          description: Erro de validação (formato/tamanho)

  /minhas-ofertas:
    get:
      tags:
        - Ofertas de Resíduos
      summary: Minhas ofertas (Fábrica)
      responses:
        '200':
          description: Lista de ofertas do usuário autenticado

  # ========== DISPONIBILIDADE DA FÁBRICA ==========
  /disponibilidade:
    get:
      tags:
        - Disponibilidade da Fábrica
      summary: Obter configuração de disponibilidade
      description: |
        Retorna a configuração de disponibilidade da fábrica logada,
        incluindo faixas de horário e bloqueios.
        Requer perfil `fabrica`.
      responses:
        '200':
          description: Configuração de disponibilidade com faixas e bloqueios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      user_id:
                        type: integer
                      dias_semana:
                        type: array
                        items:
                          type: integer
                        example: [1, 2, 3, 4, 5]
                        description: "Dias da semana (0=dom, 1=seg, ..., 6=sab)"
                      duracao_coleta_min:
                        type: integer
                        nullable: true
                        example: 60
                        description: "30, 60, 120 minutos. null = dia inteiro"
                      antecedencia_minima_dias:
                        type: integer
                        example: 1
                        description: "0 = mesmo dia, 1 = 1 dia, etc."
                      max_coletas_dia:
                        type: integer
                        example: 3
                      faixas_horarios:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            hora_inicio:
                              type: string
                              example: "08:00"
                            hora_fim:
                              type: string
                              example: "12:00"
                      bloqueios:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            data_bloqueio:
                              type: string
                              format: date
                              example: "2026-12-25"
                            motivo:
                              type: string
                              example: "Feriado de Natal"
        '404':
          description: Configuração de disponibilidade não encontrada
        '401':
          description: Não autenticado
    put:
      tags:
        - Disponibilidade da Fábrica
      summary: Criar ou atualizar configuração de disponibilidade
      description: |
        Cria ou atualiza (upsert) a configuração geral de disponibilidade
        da fábrica logada. Requer perfil `fabrica`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dias_semana, antecedencia_minima_dias, max_coletas_dia]
              properties:
                dias_semana:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3, 4, 5]
                  description: "Dias da semana disponíveis (0=dom, 1=seg, ..., 6=sab)"
                duracao_coleta_min:
                  type: integer
                  nullable: true
                  enum: [30, 60, 120, null]
                  example: 60
                  description: "Duração em minutos. null = dia inteiro"
                antecedencia_minima_dias:
                  type: integer
                  example: 1
                  description: "0 = mesmo dia"
                max_coletas_dia:
                  type: integer
                  example: 3
                  description: "Máximo de coletas por dia (limite global da fábrica)"
      responses:
        '200':
          description: Disponibilidade salva com sucesso
        '422':
          description: Erro de validação
        '401':
          description: Não autenticado

  /disponibilidade/faixas-horarios:
    get:
      tags:
        - Disponibilidade da Fábrica
      summary: Listar faixas de horário
      description: |
        Lista as faixas de horário configuradas pela fábrica logada.
        Requer que a configuração de disponibilidade exista.
      responses:
        '200':
          description: Lista de faixas de horário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        hora_inicio:
                          type: string
                          example: "08:00"
                        hora_fim:
                          type: string
                          example: "12:00"
        '404':
          description: Configure a disponibilidade antes
        '401':
          description: Não autenticado
    post:
      tags:
        - Disponibilidade da Fábrica
      summary: Adicionar faixa de horário
      description: |
        Adiciona uma nova faixa de horário à configuração da fábrica logada.
        Permite múltiplas faixas (ex: manhã e tarde).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hora_inicio, hora_fim]
              properties:
                hora_inicio:
                  type: string
                  example: "08:00"
                  description: "Formato HH:mm"
                hora_fim:
                  type: string
                  example: "12:00"
                  description: "Formato HH:mm. Deve ser posterior a hora_inicio"
      responses:
        '201':
          description: Faixa de horário adicionada
        '404':
          description: Configure a disponibilidade antes
        '422':
          description: Erro de validação (hora_fim deve ser após hora_inicio)
        '401':
          description: Não autenticado

  /disponibilidade/faixas-horarios/{id}:
    delete:
      tags:
        - Disponibilidade da Fábrica
      summary: Remover faixa de horário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID da faixa de horário
      responses:
        '200':
          description: Faixa de horário removida
        '403':
          description: Esta faixa não pertence à sua configuração
        '404':
          description: Faixa não encontrada
        '401':
          description: Não autenticado

  /disponibilidade/bloqueios:
    get:
      tags:
        - Disponibilidade da Fábrica
      summary: Listar bloqueios de data
      description: |
        Lista os bloqueios de datas específicas configurados pela fábrica (feriados, férias, etc).
      responses:
        '200':
          description: Lista de bloqueios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        data_bloqueio:
                          type: string
                          format: date
                          example: "2026-12-25"
                        motivo:
                          type: string
                          nullable: true
                          example: "Feriado de Natal"
        '404':
          description: Configure a disponibilidade antes
        '401':
          description: Não autenticado
    post:
      tags:
        - Disponibilidade da Fábrica
      summary: Adicionar bloqueio de data
      description: |
        Bloqueia uma data específica impedindo agendamentos de coleta.
        Útil para feriados, férias, manutenção, etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_bloqueio]
              properties:
                data_bloqueio:
                  type: string
                  format: date
                  example: "2026-12-25"
                  description: "Data a bloquear (deve ser hoje ou futura)"
                motivo:
                  type: string
                  nullable: true
                  example: "Feriado de Natal"
                  description: "Motivo opcional do bloqueio"
      responses:
        '201':
          description: Bloqueio adicionado
        '404':
          description: Configure a disponibilidade antes
        '422':
          description: Erro de validação ou data duplicada
        '401':
          description: Não autenticado

  /disponibilidade/bloqueios/{id}:
    delete:
      tags:
        - Disponibilidade da Fábrica
      summary: Remover bloqueio de data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID do bloqueio
      responses:
        '200':
          description: Bloqueio removido
        '403':
          description: Este bloqueio não pertence à sua configuração
        '404':
          description: Bloqueio não encontrado
        '401':
          description: Não autenticado

  # ========== COLETAS ==========
  /ofertas/{id}/reservar:
    post:
      tags:
        - Coletas
      summary: Agendar coleta de uma oferta
      description: |
        Agenda uma coleta para a oferta especificada.
        O coletor deve informar a data e horário desejado.
        O sistema valida automaticamente:
        - Se a fábrica opera no dia da semana escolhido
        - Se a data não está bloqueada (feriado, férias)
        - Se a antecedência mínima é respeitada
        - Se o horário está dentro das faixas disponíveis
        - Se o limite diário de coletas da fábrica não foi atingido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_agendamento]
              properties:
                data_agendamento:
                  type: string
                  format: date-time
                  example: "2026-06-15T09:00:00"
                  description: "Data e horário desejado para a coleta"
      responses:
        '201':
          description: Coleta agendada com sucesso
        '400':
          description: Oferta não disponível para coleta
        '422':
          description: |
            Erro de validação do agendamento. Possíveis motivos:
            - Fábrica não opera neste dia da semana
            - Data bloqueada pela fábrica
            - Antecedência mínima não respeitada
            - Horário fora das faixas disponíveis
            - Limite de coletas da fábrica atingido para o dia
            - Fábrica sem configuração de disponibilidade

  /ofertas/{id}/slots-disponiveis:
    get:
      tags:
        - Coletas
      summary: Consultar slots disponíveis para agendamento
      description: |
        Retorna os horários disponíveis para agendamento de coleta em uma data específica.
        Considera a configuração de disponibilidade da fábrica, bloqueios, faixas horárias
        e coletas já agendadas no dia. Útil para o frontend montar o seletor de horários.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID da oferta
        - name: data
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Data desejada (YYYY-MM-DD)"
          example: "2026-06-15"
      responses:
        '200':
          description: Slots disponíveis para a data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slots:
                        type: array
                        description: "Lista de faixas horárias disponíveis. Vazio se não há slots."
                        items:
                          type: object
                          properties:
                            hora_inicio:
                              type: string
                              example: "08:00"
                            hora_fim:
                              type: string
                              example: "12:00"
                            tipo:
                              type: string
                              description: "Presente apenas quando é dia inteiro"
                              example: "dia_inteiro"
                      duracao_coleta_min:
                        type: integer
                        nullable: true
                        description: "Duração de cada coleta em minutos"
                      coletas_restantes:
                        type: integer
                        description: "Quantas coletas ainda podem ser agendadas no dia"
                      lotado:
                        type: boolean
                        description: "Presente e true quando o limite diário foi atingido"
        '422':
          description: Fábrica sem configuração de disponibilidade

  /minhas-coletas:
    get:
      tags:
        - Coletas
      summary: Minhas coletas (Coletor)
      responses:
        '200':
          description: Lista de coletas do coletor autenticado

  /coletas/{id}:
    get:
      tags:
        - Coletas
      summary: Detalhar coleta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da coleta
        '403':
          description: Acesso não autorizado

  /coletas/{id}/cancelar:
    post:
      tags:
        - Coletas
      summary: Cancelar coleta (Coletor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Coleta cancelada e oferta retorna a Disponível
        '403':
          description: Acesso não autorizado ou coleta já concluída

  /coletas/{id}/confirmar-fabrica:
    post:
      tags:
        - Coletas
      summary: Confirmar retirada - Fábrica
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Confirmação da fábrica registrada
        '403':
          description: Acesso não autorizado

  /coletas/{id}/confirmar-coletor:
    post:
      tags:
        - Coletas
      summary: Confirmar retirada - Coletor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Confirmação do coletor registrada
        '403':
          description: Acesso não autorizado

  # ========== MATERIAIS (PÚBLICO) ==========
  /materiais:
    get:
      tags:
        - Materiais
      summary: Listar materiais ativos (público)
      security: []
      responses:
        '200':
          description: Lista de materiais ativos

  # ========== DASHBOARD - ADMIN (/api/admin) ==========
  /admin/dashboard/metricas:
    get:
      tags:
        - Admin - Dashboard
      summary: Métricas consolidadas da plataforma
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/dashboard/metricas`
        Retorna contadores agrupados de usuários, ofertas, coletas e impacto ambiental.
      responses:
        '200':
          description: Métricas consolidadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuarios:
                    type: object
                    properties:
                      total:
                        type: integer
                      fabricas:
                        type: integer
                      coletores:
                        type: integer
                      admins:
                        type: integer
                      inativos:
                        type: integer
                  ofertas:
                    type: object
                    properties:
                      total:
                        type: integer
                      disponiveis:
                        type: integer
                      em_processo:
                        type: integer
                      concluidas:
                        type: integer
                      moderadas:
                        type: integer
                  coletas:
                    type: object
                    properties:
                      total:
                        type: integer
                      pendentes:
                        type: integer
                      concluidas:
                        type: integer
                      canceladas:
                        type: integer
                  impacto:
                    type: object
                    properties:
                      total_kg:
                        type: number
                        format: float
                      total_cacambas:
                        type: integer
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (não é admin)

  # ========== USUÁRIOS - ADMIN (/api/admin) ==========
  /admin/usuarios:
    get:
      tags:
        - Admin - Usuários
      summary: Listar usuários
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/usuarios`
        Suporta os filtros opcionais `?tipo_perfil=fabrica|coletor|admin` e `?status=ativo|inativo`.
      parameters:
        - name: tipo_perfil
          in: query
          description: Filtrar por tipo de perfil
          required: false
          schema:
            type: string
            enum: [fabrica, coletor, admin]
        - name: status
          in: query
          description: Filtrar por status do usuário
          required: false
          schema:
            type: string
            enum: [ativo, inativo]
      responses:
        '200':
          description: Lista paginada de usuários
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (não é admin)

  /admin/usuarios/{id}:
    get:
      tags:
        - Admin - Usuários
      summary: Detalhar usuário
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/usuarios/{id}`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes do usuário
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Usuário não encontrado

  /admin/usuarios/{id}/status:
    put:
      tags:
        - Admin - Usuários
      summary: Alterar status do usuário (Ativar/Inativar)
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/usuarios/{id}/status`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo:
                  type: boolean
                  description: "true para ativar, false para inativar (banir)"
      responses:
        '200':
          description: Status atualizado com sucesso
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Usuário não encontrado

  # ========== OFERTAS - ADMIN (/api/admin) ==========
  /admin/ofertas:
    get:
      tags:
        - Admin - Ofertas
      summary: Listar todas as ofertas (Moderação)
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/ofertas`
        Lista ofertas com filtro opcional de material, status ou se já foram moderadas.
      parameters:
        - name: material_id
          in: query
          description: Filtrar por ID do material
          required: false
          schema:
            type: integer
        - name: status
          in: query
          description: Filtrar por status da oferta
          required: false
          schema:
            type: string
            enum: [Disponível, Em Processo de Coleta, Concluido, Cancelado]
        - name: moderadas
          in: query
          description: Mostrar apenas ofertas já moderadas (apagadas)
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Lista paginada de ofertas
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (não é admin)

  /admin/ofertas/{id}:
    get:
      tags:
        - Admin - Ofertas
      summary: Detalhar oferta (Moderação)
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/ofertas/{id}`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da oferta, mesmo se moderada
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Oferta não encontrada
    delete:
      tags:
        - Admin - Ofertas
      summary: Moderar (excluir) oferta
      description: |
        Requer autenticação com perfil admin.
        Remove uma oferta do mural público.
        Prefixo real: `/api/admin/ofertas/{id}`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Oferta moderada com sucesso
        '400':
          description: Oferta já excluída
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Oferta não encontrada

  /admin/ofertas/{id}/restore:
    post:
      tags:
        - Admin - Ofertas
      summary: Restaurar oferta moderada
      description: |
        Requer autenticação com perfil admin.
        Devolve a oferta ao mural público.
        Prefixo real: `/api/admin/ofertas/{id}/restore`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Oferta restaurada com sucesso
        '400':
          description: Oferta não está excluída
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Oferta não encontrada

  # ========== COLETAS - ADMIN (/api/admin) ==========
  /admin/coletas:
    get:
      tags:
        - Admin - Coletas
      summary: Listar todas as coletas (Auditoria)
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/coletas`
        Retorna a visão global de todas as transações de coleta, com filtro opcional por status.
      parameters:
        - name: status
          in: query
          description: Filtrar por status da coleta
          required: false
          schema:
            type: string
            enum: [pendente, concluido, cancelado]
      responses:
        '200':
          description: Lista paginada de coletas com relacionamentos (coletor, fábrica, material)
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (não é admin)

  /admin/coletas/{id}:
    get:
      tags:
        - Admin - Coletas
      summary: Detalhar coleta (Auditoria)
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/coletas/{id}`
        Retorna todos os detalhes da transação, incluindo confirmações de ambos os lados.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes completos da coleta (coletor, fábrica, material, endereço, imagens)
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Coleta não encontrada

  # ========== MATERIAIS - ADMIN (/api/admin) ==========
  /admin/materiais:
    post:
      tags:
        - Admin - Materiais
      summary: Criar material
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/materiais`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, descricao]
              properties:
                nome:
                  type: string
                  example: "Caco de Cerâmica"
                descricao:
                  type: string
                  example: "Resíduo de cerâmica queimada"
                ativo:
                  type: boolean
                  example: true
                cortante:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Material criado com sucesso
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado (não é admin)

  /admin/materiais/{id}:
    get:
      tags:
        - Admin - Materiais
      summary: Detalhar material
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/materiais/{id}`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes do material
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Material não encontrado
    put:
      tags:
        - Admin - Materiais
      summary: Atualizar material
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/materiais/{id}`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: "Caco de Cerâmica Atualizado"
                descricao:
                  type: string
                ativo:
                  type: boolean
                cortante:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Material atualizado com sucesso
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
    delete:
      tags:
        - Admin - Materiais
      summary: Excluir material
      description: |
        Requer autenticação com perfil admin.
        Prefixo real: `/api/admin/materiais/{id}`
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Material excluído com sucesso
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado

  # ========== DASHBOARD ==========
  /dashboard/impacto:
    get:
      tags:
        - Dashboard
      summary: Dashboard de impacto ambiental (público)
      security: []
      responses:
        '200':
          description: Métricas de impacto ambiental
